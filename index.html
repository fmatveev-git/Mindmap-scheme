<!doctype html>
<html lang="ru"><head><meta charset="utf-8">

<style>

<div id="cw"><svg id="cv"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><g id="g"></g></svg><div id="zc"><button id="zm" title="Режим рамки: тяните по пустому месту, чтобы выделить блоки. Ctrl/Shift + перетаскивание делает то же без режима">▭</button><button id="zi" title="Приблизить">+</button><button id="zo" title="Отдалить">−</button><button id="zf" title="Вписать">⤢</button></div></div>

<script>
const W=170,H=64,G=22,NS='http://www.w3.org/2000/svg',$=s=>document.querySelector(s);

 p.free.forEach(n=>{n._va=(!FLT||FLT.C.has(n.id))?n:null;n._x=n.x||0;n._y=n.y||0});
}

const clip=(a,dx,dy)=>{const t=Math.min((W/2+5)/Math.abs(dx||1e-9),(H/2+5)/Math.abs(dy||1e-9));return[a._x+dx*t,a._y+dy*t]};

function render(){
 layout();const p=P(),h=p.dir==='h';g.innerHTML='';
 const es=ES(),eg=add('g',{},g),lg=add('g',{},g),ng=add('g',{},g);
 const drawNode=(n,pa)=>{
  if(n._va!==n)return;
  if(pa){
   const ec={...es.tree,...(n.eo||{})},ed=conn(pa,n,ec.type,treeHor(pa,n,h));
   if(!sel&&selE&&selE.n===n)add('path',{d:ed,fill:'none',stroke:'var(--ac)','stroke-width':(+ec.w)+6,opacity:.35},eg);
   add('path',{d:ed,...sty(ec,'var(--ln)')},eg);
   add('path',{d:ed,fill:'none',stroke:'transparent','stroke-width':14,style:'cursor:pointer'},eg).onclick=ev=>{ev.stopPropagation();selE={n};sel=null;ms.clear();linkMode=false;render();panel()}}
  const NW=n._w,NH=nh(n);const q=add('g',{transform:`translate(${n._x-NW/2},${n._y-NH/2})`,style:'cursor:pointer',class:'nd'},ng);if(FLT&&!FLT.C.has(n.id))q.setAttribute('opacity',.45);
  if(n.id===sel||ms.has(n.id))shape(n,5,q,{fill:'none',stroke:'var(--ac)','stroke-width':3,opacity:.6});
  const ef=effFill(n),par0=n.ch.length>0;
  shape(n,0,q,{fill:par0?dk(ef||nodeBase()):(ef||'var(--node)'),stroke:n.stroke||'var(--ln)','stroke-width':n.sw+(par0?1.5:0),'stroke-dasharray':n.dash?'6 4':'none'});
  const tc=ef?onCol(par0?dk(ef):ef):'var(--tx)';

  Ln.forEach((ln,i)=>{const t1=add('text',{x:NW/2,y:top+12+i*16,'text-anchor':'middle','font-size':13,'font-weight':600,fill:tc},q);t1.textContent=ln});
  if(sub){const t2=add('text',{x:NW/2,y:top+Ln.length*16+12,'text-anchor':'middle','font-size':11,fill:tc,opacity:.8},q);t2.textContent=cut(sub,Math.floor(NW/5))}
  if(n.link){const a=add('text',{x:NW-14,y:14,'font-size':11},q);a.textContent='🔗';a.onclick=e=>{e.stopPropagation();window.open(/^https?:/.test(n.link)?n.link:'https://'+n.link,'_blank','noopener')}}

  if(n.status&&n.fill)add('circle',{cx:12,cy:NH-12,r:5,fill:stCol(n.status),stroke:'var(--ln)','stroke-width':1},q);

   ab.onpointerdown=e=>e.stopPropagation();ab.ondblclick=e=>e.stopPropagation();ab.onclick=e=>{e.stopPropagation();noZ=Date.now();ms.clear();selE=null;addChild(n)}}

$('#doimp').onclick=()=>{try{if(!$('#it').value.trim())throw 0;const ps=parseIn($('#it').value,$('#it').dataset.name||'Импорт');
 ps.forEach(p=>all(p.root,n=>(n.grp||[]).forEach(x=>addPerson(x))));S.projects.push(...ps);S.cur=S.projects.length-1;sel=null;save();projUI();render();panel();fit();dlg.close()}catch(e){$('#imsg').textContent='Не удалось разобрать содержимое. Проверьте формат.'}};
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render())}catch(e){}
// schemes stored in the repository (data.json, deployed with the site)
const dump=()=>{const rev=Date.now();S.seenRev=rev;save();return JSON.stringify({...S,rev},(k,v)=>k[0]==='_'||k==='seenRev'?undefined:v,1)};
$('#doall').onclick=()=>{$('#it').value=dump();$('#imsg').textContent='Это все проекты целиком. Сохраните их в репозиторий файлом data.json: после деплоя они появятся на сайте.'};
$('#dl').onclick=()=>dlFile(dump(),'data.json');
$('#rb').onclick=()=>{let b=null;try{b=JSON.parse(localStorage.getItem('planner2-backup'))}catch(e){}
 if(!b||!b.projects||!b.projects.length){$('#imsg').textContent='Резервной копии нет.';return}
 const rev=S.seenRev;S=b;S.seenRev=rev;if(!Array.isArray(S.people))S.people=[];sel=null;selE=null;save();projUI();render();panel();fit();dlg.close()};
function loadRepo(){fetch('data.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{
 if(!d||!Array.isArray(d.projects)||!d.projects.length)return;const rev=+d.rev||0;
 if(!fresh&&rev<=(+S.seenRev||0))return;
 if(fresh)return takeRepo(d,rev);
 const b=document.createElement('div');b.style.cssText='position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:7;max-width:calc(100% - 40px);display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--pn);border:1px solid var(--ac);border-radius:10px;padding:8px 12px;box-shadow:0 4px 16px #0003;font-size:13px';
 b.innerHTML='<span>Опубликованы обновлённые схемы. Загрузить их вместо текущих? Текущие сохранятся в резервной копии.</span><button id="rp_y" class="on">Загрузить</button><button id="rp_n">Оставить мои</button>';
 $('#cw').appendChild(b);$('#rp_y').onclick=()=>{b.remove();takeRepo(d,rev)};$('#rp_n').onclick=()=>{b.remove();S.seenRev=rev;save()}}).catch(()=>{})}
function takeRepo(d,rev){if(!fresh){try{localStorage.setItem('planner2-backup',localStorage.getItem('planner2')||'')}catch(e){}}
 S={cur:Math.max(0,Math.min(+d.cur||0,d.projects.length-1)),people:Array.isArray(d.people)?d.people:[],projects:d.projects,seenRev:rev};
 fresh=false;sel=null;selE=null;linkMode=false;save();projUI();render();panel();fit()}
projUI();render();panel();requestAnimationFrame(fit);loadRepo();
</script></body></html>
